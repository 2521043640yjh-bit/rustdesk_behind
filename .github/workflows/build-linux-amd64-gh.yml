name: Build Linux amd64

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build-linux-amd64:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TARGET: x86_64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          targets: x86_64-unknown-linux-musl

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build binaries
        run: cross build --release --bin hbbs --bin hbbr --bin rustdesk-utils --target $TARGET

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/$TARGET/release/hbbs dist/
          cp target/$TARGET/release/hbbr dist/
          cp target/$TARGET/release/rustdesk-utils dist/
          tar -C dist -czf rustdesk-server-linux-amd64-github.tar.gz .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-linux-amd64
          path: |
            dist/hbbs
            dist/hbbr
            dist/rustdesk-utils
            rustdesk-server-linux-amd64-github.tar.gz
          if-no-files-found: error
